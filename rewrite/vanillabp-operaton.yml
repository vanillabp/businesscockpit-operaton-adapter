# VanillaBP's own names for the Business Cockpit extension for Operaton.
#
# The code of this repository is made from the Business Cockpit extension for Camunda 7 in two
# steps (see bin/sync-from-camunda7.sh). First Operaton's own recipe renames everything which
# belongs to the engine: packages, Maven coordinates, the getters of the model API. Then this
# recipe renames what belongs to VanillaBP: the Operaton adapter the extension plugs into, the
# Java package and the classes of the extension, and the names in strings. Without this second
# step the extension could not sit next to the Camunda 7 extension in one application, and that
# side-by-side setup is how an application moves from Camunda 7 to Operaton.
#
# Every text rule is case sensitive. A rule which is not would turn 'camunda7' into
# 'Operaton' as well.
#
# The recipes run in the order they are listed. The type renames come first, because they
# name the classes by their old package. The text rules come last, because they also see
# what the Java recipes left behind. A text rule turns a file into plain text, and no Java or
# XML recipe sees that file afterwards.
---
type: specs.openrewrite.org/v1beta/recipe
name: io.vanillabp.cockpit.operaton.FromCamunda7
displayName: VanillaBP's own names for the Business Cockpit extension for Operaton
description: Renames the adapter, the Java package, the classes and the names in strings of the Business Cockpit extension for Camunda 7.
recipeList:
  - io.vanillabp.cockpit.operaton.OperatonVersionComesFromTheAdapter
  # One entry per class whose name contains 'Camunda7'. Do not edit the lines between the two
  # markers by hand: bin/write-type-renames.sh writes them from the sources.
  # BEGIN type renames, written by bin/write-type-renames.sh
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.vanillabp.cockpit.camunda7.Camunda7BusinessCases
      newFullyQualifiedTypeName: io.vanillabp.cockpit.camunda7.OperatonBusinessCases
  - org.openrewrite.java.ChangeType:
